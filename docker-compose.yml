services:
  billy:
    image: rhysdock/billy:latest
    container_name: billy
    restart: unless-stopped
    ports:
      - "4823:4823"
    volumes:
      - ./data:/data
    environment:
      - DB_PATH=/data/billy.db
      - PORT=4823
      # Optional: set a static API key (or generate one in the Settings UI instead)
      # - API_KEY=your-secret-key-here
