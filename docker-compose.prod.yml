services:
  billy:
    image: rhysdock/billy:latest
    container_name: billy
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Change left side to your TrueNAS data path e.g. /mnt/tank/apps/billy/data:/data
      - /mnt/tank/apps/billy/data:/data
    environment:
      - DB_PATH=/data/billy.db
      - PORT=3000
      # Optional: set an API key to protect all endpoints
      # - API_KEY=your-secret-key-here
